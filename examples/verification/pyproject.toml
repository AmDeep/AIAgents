[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "completion-verification-lab"
version = "0.1.0"
description = "Independent postcondition gate for completion claims"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
completion-check-demo = "completion_verification_lab.demo:main"

[tool.setuptools]
packages = ["completion_verification_lab"]

[tool.setuptools.package-dir]
completion_verification_lab = "."
