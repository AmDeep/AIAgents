[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-contract-lab"
version = "0.1.0"
description = "Strict JSON tool boundary and explicit error result example"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
tool-contract-demo = "tool_contract_lab.demo:main"

[tool.setuptools]
packages = ["tool_contract_lab"]

[tool.setuptools.package-dir]
tool_contract_lab = "."

[tool.setuptools.package-data]
tool_contract_lab = ["schemas/*.json"]
