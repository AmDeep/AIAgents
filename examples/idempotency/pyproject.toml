[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idempotency-ledger-lab"
version = "0.1.0"
description = "SQLite idempotency ledger and checkpoint example"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
idempotency-demo = "idempotency_ledger_lab.demo:main"

[tool.setuptools]
packages = ["idempotency_ledger_lab"]

[tool.setuptools.package-dir]
idempotency_ledger_lab = "."
