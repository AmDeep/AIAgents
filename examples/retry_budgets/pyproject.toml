[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retry-budget-lab"
version = "0.1.0"
description = "Bounded retries, backoff and run budget example"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
retry-budget-demo = "retry_budget_lab.demo:main"

[tool.setuptools]
packages = ["retry_budget_lab"]

[tool.setuptools.package-dir]
retry_budget_lab = "."
