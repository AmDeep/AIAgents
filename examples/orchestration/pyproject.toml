[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-contract-lab"
version = "0.1.0"
description = "Typed supervisor-worker handoff contract example"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
handoff-demo = "handoff_contract_lab.demo:main"

[tool.setuptools]
packages = ["handoff_contract_lab"]

[tool.setuptools.package-dir]
handoff_contract_lab = "."
