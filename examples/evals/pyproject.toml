[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness-lab"
version = "0.1.0"
description = "Deterministic categorized regression evaluation harness"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
eval-harness-demo = "agent_eval_harness_lab.demo:main"

[tool.setuptools]
packages = ["agent_eval_harness_lab"]

[tool.setuptools.package-dir]
agent_eval_harness_lab = "."
