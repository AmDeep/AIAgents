[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trusted-fixture-runner-lab"
version = "0.1.0"
description = "Bounded local subprocess runner for trusted fixtures"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
fixture-runner-demo = "trusted_fixture_runner_lab.demo:main"

[tool.setuptools]
packages = ["trusted_fixture_runner_lab"]

[tool.setuptools.package-dir]
trusted_fixture_runner_lab = "."
