[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "run-recovery-lab"
version = "0.1.0"
description = "Append-only event log and local state reconstruction example"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
run-recovery-demo = "run_recovery_lab.demo:main"

[tool.setuptools]
packages = ["run_recovery_lab"]

[tool.setuptools.package-dir]
run_recovery_lab = "."
